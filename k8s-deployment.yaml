apiVersion: apps/v1
kind: Deployment
metadata:
  name: novaoffice-oa-go
  labels:
    app: novaoffice-oa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novaoffice-oa
  template:
    metadata:
      labels:
        app: novaoffice-oa
    spec:
      containers:
      - name: backend-go
        image: your-registry/novaoffice-backend-go:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: novaoffice-oa-service
spec:
  selector:
    app: novaoffice-oa
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
